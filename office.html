<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DCL AI Office — バーチャルオフィス</title>
<style>
:root{
  --ink:#2a2118; --dim:#b6a789;
  --wall:#d8b98a; --wall2:#c9a878; --wall-dark:#a9824f; --base:#8a6438;
  --floor:#c69657; --floor2:#bd8a49; --plank:rgba(90,55,20,.18);
  --frame:#6b4a2a;
}
*{box-sizing:border-box}
html,body{margin:0;background:#241a10}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#f3ead9;-webkit-font-smoothing:antialiased}

.screen-wrap{width:100%;overflow-x:auto;background:#1c140b}
.stage{position:relative;width:100%;min-width:960px;max-width:1580px;margin:0 auto;aspect-ratio:16/9.6;overflow:hidden;
  background:radial-gradient(120% 80% at 50% 0%,rgba(255,240,200,.16),transparent 55%),linear-gradient(180deg,#3a2a18,#2a1e12);
  box-shadow:inset 0 0 160px rgba(0,0,0,.55)}
.stage::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 2px,transparent 2px 30px),linear-gradient(180deg,#5a4026,#4a331d);pointer-events:none}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 90% at 50% 42%,transparent 60%,rgba(0,0,0,.4))}

/* HUD */
.hud{position:absolute;left:0;right:0;top:0;height:7%;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:60}
.live{display:inline-flex;align-items:center;gap:7px;background:#ff3b52;color:#fff;font-weight:900;letter-spacing:.12em;font-size:14px;padding:5px 12px;border-radius:9px;box-shadow:0 4px 12px rgba(255,59,82,.4);border:2px solid #ffd7dd}
.live b{width:9px;height:9px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.backlink{margin-left:12px;color:#f3ead9;text-decoration:none;font-size:12.5px;border:1px solid rgba(255,255,255,.22);padding:6px 12px;border-radius:9px;background:rgba(30,20,10,.5)}
.hud-r{display:flex;align-items:center;gap:10px}
.chip{background:rgba(24,16,8,.6);border:1px solid rgba(255,255,255,.16);border-radius:99px;padding:6px 13px;color:#f7efe0}
.clock2{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;letter-spacing:.04em}
.online{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#8fe4b0}
.online i{width:8px;height:8px;border-radius:50%;background:#43d98a;box-shadow:0 0 8px #43d98a}
.gear{cursor:pointer;font-size:16px;user-select:none}
.menu{position:absolute;right:16px;top:7%;z-index:65;background:#241a10;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:8px;display:none;min-width:220px;box-shadow:0 18px 44px rgba(0,0,0,.55)}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;background:transparent;color:#f3ead9;border:none;font:inherit;padding:9px 10px;border-radius:8px;cursor:pointer}
.menu button:hover{background:rgba(255,255,255,.08)}
.menu .hint{color:#b6a789;font-size:11px;padding:6px 10px 2px;border-top:1px solid rgba(255,255,255,.14);margin-top:4px}

/* rooms */
.room2{position:absolute;border:3px solid var(--frame);border-radius:8px;overflow:hidden;z-index:1;transition:box-shadow .3s,border-color .3s;box-shadow:0 12px 26px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,235,200,.15)}
.wall{position:absolute;left:0;right:0;top:0;height:44%;background:repeating-linear-gradient(90deg,rgba(0,0,0,.04) 0 1px,transparent 1px 46px),linear-gradient(180deg,var(--wall),var(--wall2));border-bottom:5px solid var(--base);box-shadow:inset 0 -10px 16px rgba(120,80,30,.25)}
.floorw{position:absolute;left:0;right:0;bottom:0;height:56%;background:repeating-linear-gradient(90deg,var(--plank) 0 1px,transparent 1px 40px),repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 22px),linear-gradient(180deg,var(--floor),var(--floor2));box-shadow:inset 0 22px 30px rgba(120,80,30,.22)}
.sunbeam{position:absolute;top:0;bottom:0;width:26%;left:60%;background:linear-gradient(120deg,transparent,rgba(255,240,200,.22),transparent);transform:skewX(-14deg);pointer-events:none}
.namehdr{position:absolute;top:6px;left:8px;z-index:6;font-weight:800;font-size:12px;color:#3a2716;background:linear-gradient(180deg,#f2e2c2,#e4cfa4);border:1px solid #b8945c;border-radius:6px;padding:2px 9px;box-shadow:0 2px 5px rgba(0,0,0,.3)}
.sub{position:absolute;top:8px;right:9px;z-index:6;font-size:8.5px;letter-spacing:.14em;color:#7c5a30;font-weight:800}
.badge2{position:absolute;top:6px;right:8px;z-index:7;font-size:10px;font-weight:800;color:#fff;background:var(--rc);padding:3px 9px;border-radius:99px;opacity:0;transition:.25s;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.room2.active .badge2{opacity:1}
.room2.active .sub{opacity:0}
.room2.active{border-color:#ffd479;box-shadow:0 0 0 3px rgba(255,196,80,.7),0 16px 34px rgba(0,0,0,.55)}

/* furniture */
.fz{position:absolute;z-index:3}
.f-frame{background:linear-gradient(180deg,#8a6a3f,#6e5231);border:2px solid #5a3f22;border-radius:3px;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.f-frame::after{content:"";position:absolute;inset:3px;background:var(--pic,linear-gradient(135deg,#cfe6d6,#a9c9df));border-radius:2px}
.f-window{border:4px solid #e4d2a8;border-radius:4px;overflow:hidden;box-shadow:0 2px 4px rgba(0,0,0,.35),inset 0 0 0 2px #b98f5c}
.f-window svg{position:absolute;inset:0;width:100%;height:100%}
.f-window::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:#e4d2a8;transform:translateX(-50%);z-index:2}
.f-window::after{content:"";position:absolute;top:50%;left:0;right:0;height:3px;background:#e4d2a8;transform:translateY(-50%);z-index:2}
.f-board{background:#fafaf5;border:3px solid #b7ad93;border-radius:3px;box-shadow:0 2px 5px rgba(0,0,0,.3);overflow:hidden}
.f-board::before{content:"";position:absolute;left:10%;top:24%;width:52%;height:0;border-top:3px solid #2b8ad6;box-shadow:0 7px 0 #e0603a,0 14px 0 #4aa05a;border-radius:2px}
.f-board::after{content:"";position:absolute;right:8%;top:26%;width:22%;height:44%;border:2px solid #7a7a7a;border-radius:2px;opacity:.45}
.f-clock{background:#f4efe2;border:3px solid #7a5230;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.35)}
.f-clock b,.f-clock i{position:absolute;left:50%;bottom:50%;transform-origin:bottom center}
.f-clock b{width:2px;height:26%;margin-left:-1px;background:#333;border-radius:1px;transform:rotate(56deg)}
.f-clock i{width:1.6px;height:38%;margin-left:-.8px;background:#c0392b;border-radius:1px;animation:sec 60s linear infinite}
@keyframes sec{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.f-shelf{background:linear-gradient(180deg,#7a4f2a,#5f3c1f);border:2px solid #4a2f18;border-radius:3px;box-shadow:0 3px 6px rgba(0,0,0,.35);overflow:hidden}
.f-shelf::before,.f-shelf::after{content:"";position:absolute;left:2px;right:2px;height:26%;background:repeating-linear-gradient(90deg,#c0562b 0 5px,#d8a13a 5px 9px,#3f7d9a 9px 13px,#6b8f4a 13px 18px,#b8863a 18px 22px);border-radius:1px}
.f-shelf::before{top:14%}.f-shelf::after{top:58%}
.f-desk{background:linear-gradient(180deg,#b98650,#8f5f30);border-radius:4px;box-shadow:0 4px 7px rgba(0,0,0,.35)}
.f-pc{position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:22px;height:15px;background:#242a38;border:2px solid #3f4658;border-radius:3px}
.f-pc::after{content:"";position:absolute;inset:2px;background:linear-gradient(135deg,#3aa0ff,#7be0c0);border-radius:1px;opacity:.85}
.f-chair{width:14px;height:14px;background:#4a3324;border-radius:4px;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.f-plant{filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.f-plant .pot{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:16px;height:12px;background:linear-gradient(180deg,#c77b48,#9c5a2e);border-radius:3px 3px 5px 5px}
.f-plant .leaf{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:26px;height:26px;background:radial-gradient(circle at 40% 35%,#6bbf5a,#3f8a3a);border-radius:60% 60% 55% 55%;box-shadow:inset -3px -3px 6px rgba(0,0,0,.2)}
.f-rug{border-radius:14px;background:radial-gradient(ellipse at 50% 45%,rgba(120,160,120,.5),rgba(90,130,95,.28));box-shadow:inset 0 0 20px rgba(0,0,0,.15);z-index:2}
.f-sofa{background:linear-gradient(180deg,#a9784f,#8a5f39);border-radius:8px;box-shadow:0 4px 8px rgba(0,0,0,.35)}
.f-sofa::before{content:"";position:absolute;left:-5px;top:2px;bottom:2px;width:8px;background:inherit;border-radius:6px}
.f-sofa::after{content:"";position:absolute;right:-5px;top:2px;bottom:2px;width:8px;background:inherit;border-radius:6px}
.f-table{background:linear-gradient(180deg,#c99a63,#b07d47);border:3px solid #8f5f30;border-radius:30px;box-shadow:0 8px 16px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.25)}
.f-coffee{width:16px;height:20px;background:linear-gradient(180deg,#3a3a44,#22222a);border-radius:3px;box-shadow:0 3px 5px rgba(0,0,0,.35)}
.f-coffee::after{content:"";position:absolute;left:3px;right:3px;top:5px;height:5px;background:#6b4a2c;border-radius:1px}

/* agents (SVG people) */
.agent{position:absolute;transform:translate(-50%,-100%);z-index:20;transition:left 2.7s cubic-bezier(.45,0,.2,1),top 2.7s cubic-bezier(.45,0,.2,1);will-change:left,top}
.agent .tok{position:relative;width:48px;height:60px;display:flex;align-items:flex-end;justify-content:center;filter:drop-shadow(0 4px 4px rgba(0,0,0,.45))}
.agent .tok::after{content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);width:28px;height:6px;border-radius:50%;background:rgba(0,0,0,.3);filter:blur(2px);z-index:-1}
.agent .tok img,.agent .tok svg{width:auto;height:100%;max-width:100%;object-fit:contain;image-rendering:auto;animation:bob 3s ease-in-out infinite;transform-origin:bottom center;-webkit-user-drag:none;user-select:none;-webkit-user-select:none;pointer-events:none}
.agent.busy .tok img,.agent.busy .tok svg{animation:hop .5s ease-in-out infinite}
.agent.walking .tok img,.agent.walking .tok svg{animation:walk .45s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(1.5deg)}}
@keyframes walk{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-2px) rotate(3deg)}}
.agent .np{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:3px;white-space:nowrap;background:#17313a;border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:3px 9px 4px;text-align:left;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.agent .np b{display:block;font-size:11px;color:#fff;font-weight:800;line-height:1.1}
.agent .np span{display:block;font-size:8px;color:#a8c6cf;letter-spacing:.04em}
.agent .np i{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:#43d98a}
.agent .bub{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-6px);margin-bottom:30px;white-space:normal;width:172px;background:#fff;color:#2a2118;border-radius:12px;padding:8px 11px;font-size:11px;line-height:1.4;box-shadow:0 12px 26px rgba(0,0,0,.5);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:30}
.agent .bub.show{opacity:1;transform:translate(-50%,-10px)}
.agent .bub::after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:#fff}

.orb{position:absolute;width:28px;height:28px;transform:translate(-50%,-50%);border-radius:7px;background:linear-gradient(180deg,#fff,#ffe1b0);border:2px solid #e8892b;box-shadow:0 6px 16px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-size:14px;z-index:40;opacity:0;transition:left 1s cubic-bezier(.5,0,.3,1),top 1s cubic-bezier(.5,0,.3,1),opacity .3s}

.caption{position:absolute;left:0;right:0;bottom:0;height:8%;display:flex;align-items:center;gap:14px;padding:0 16px;z-index:50;background:linear-gradient(0deg,rgba(20,14,8,.92),transparent)}
.runbtn{border:none;cursor:pointer;font:inherit;font-weight:800;color:#fff;background:linear-gradient(120deg,#f2861f,#e35d12);padding:10px 18px;border-radius:10px;box-shadow:0 6px 16px rgba(226,93,18,.4)}
.runbtn:disabled{opacity:.55;cursor:default}
.cap-msg{font-size:12.5px;color:#c9b89b}.cap-msg b{color:#fff}
.tickerline{margin-left:auto;max-width:46%;font-size:12px;color:#f3ead9;background:rgba(24,16,8,.7);border:1px solid rgba(255,255,255,.16);border-radius:9px;padding:7px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media(max-width:700px){.stage{aspect-ratio:auto;height:155vw}}
</style>
</head>
<body>
<div class="screen-wrap">
<div class="stage" id="stage">
  <div class="hud">
    <div style="display:flex;align-items:center">
      <span class="live"><b></b>LIVE</span>
      <a class="backlink" href="index.html">← ダッシュボード</a>
    </div>
    <div class="hud-r">
      <span class="chip clock2" id="clock">--:--:--</span>
      <span class="chip online"><i></i>オンライン</span>
      <span class="chip gear" id="gear">⚙</span>
    </div>
  </div>
  <div class="menu" id="menu">
    <button id="mRun">▶ デモ再生（稼働シミュレーション）</button>
    <button id="mChat">💬 雑談 ON / OFF</button>
    <div class="hint" id="mInfo">DCL AI Office ・ 18名のメンバーが稼働中</div>
    <div class="hint">キャラ素材: DOT ILLUST（dot-illust.net）／画像の転載・再配布はご遠慮ください</div>
  </div>
  <div class="caption">
    <button class="runbtn" id="runBtn">▶ 稼働シミュレーション</button>
    <span class="cap-msg" id="capMsg">Claude Codeで<b>「オフィス稼働」</b>すると、メンバーが動いて案件をこなします。</span>
    <span class="tickerline" id="tickerline"></span>
  </div>
</div>
</div>

const CHARS=["character_shakaijin_man_silver_black.png","character_shakaijin_man_01_black_black.png","character_shakaijin_man_02_gray_black.png","character_shakaijin_woman_01_black.png","character_shakaijin_woman_02_gray.png","character_shakaijin_man_03_black_brown.png","character_shakaijin_woman_03_black.png","character_shakaijin_woman_04_gray.png","character_shakaijin_man_01_gray_brown.png","character_shakaijin_woman_05_black.png","character_shakaijin_man_02_black_brown.png","character_shakaijin_woman_06_gray.png"];
const GENDERS=["M","M","M","F","F","M","F","F","M","F","M","F"]; // CHARSと同順（名前の性別一致に使用）
// 公開デモ用の自作SVGキャラ（DOT ILLUST素材を使わない）
const SKINS=["#f2c9a4","#e7b78e","#d59e76","#c68a5b","#f6d5b3"];
const HAIRS=["#33281f","#4b3220","#6b4a2c","#8a5a2b","#20242b","#7a4b8f","#b5642e","#9a9a9a"];
function personSVG(i,shirt,gender){
  const skin=SKINS[i%SKINS.length], hair=HAIRS[(i*3+1)%HAIRS.length], female=(gender==="F");
  let back="",extra="";
  if(female){ back=`<rect x="10" y="16" width="24" height="26" rx="10" fill="${hair}"/>`; }
  else if(i%2===0){ extra=`<path d="M11 12 l3 -5 3 5 3 -5 3 5 3 -5 3 5 2 -5 2 5z" fill="${hair}"/>`; }
  return `<svg viewBox="0 0 44 62" xmlns="http://www.w3.org/2000/svg">${back}`+
    `<ellipse cx="22" cy="59" rx="12" ry="3" fill="rgba(0,0,0,.18)"/>`+
    `<rect x="15" y="47" width="5" height="11" rx="2.4" fill="#3a3340"/><rect x="24" y="47" width="5" height="11" rx="2.4" fill="#3a3340"/>`+
    `<rect x="8" y="31" width="6" height="15" rx="3" fill="${shirt}"/><rect x="30" y="31" width="6" height="15" rx="3" fill="${shirt}"/>`+
    `<rect x="11" y="30" width="22" height="21" rx="8" fill="${shirt}"/>`+
    `<rect x="19" y="26" width="6" height="6" rx="2" fill="${skin}"/>`+
    `<ellipse cx="22" cy="15" rx="12.5" ry="10.5" fill="${hair}"/><circle cx="22" cy="19" r="11" fill="${skin}"/>`+
    `<path d="M11 15 a11 11 0 0 1 22 0 q-11 -8 -22 0z" fill="${hair}"/>${extra}`+
    `<circle cx="18" cy="19.5" r="1.5" fill="#2b2b2b"/><circle cx="26" cy="19.5" r="1.5" fill="#2b2b2b"/>`+
    `<path d="M19.5 24 q2.5 2.4 5 0" stroke="#b56a4a" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>`;
}
const stage=document.getElementById('stage');
const anchor=document.querySelector('.caption');
// キャラ素材(DOT ILLUST)の転載抑止：右クリック/ドラッグ保存を無効化（完全防止ではない）
["contextmenu","dragstart"].forEach(function(ev){stage.addEventListener(ev,function(e){e.preventDefault();});});

const SKYLINE=`<svg viewBox="0 0 100 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="100" height="60" fill="#cfe6f2"/><rect y="30" width="100" height="30" fill="#c4dded"/>
  <circle cx="80" cy="13" r="7" fill="#fdeec0"/>
  <g fill="#8093ad"><rect x="2" y="30" width="13" height="30"/><rect x="27" y="34" width="12" height="26"/><rect x="52" y="30" width="14" height="30"/><rect x="80" y="26" width="16" height="34"/></g>
  <g fill="#6f83a0"><rect x="16" y="20" width="10" height="40"/><rect x="40" y="24" width="10" height="36"/><rect x="67" y="18" width="11" height="42"/></g>
  <g fill="#ffd97a"><rect x="19" y="26" width="2" height="3"/><rect x="22" y="32" width="2" height="3"/><rect x="70" y="24" width="2" height="3"/><rect x="73" y="31" width="2" height="3"/><rect x="43" y="30" width="2" height="3"/><rect x="84" y="33" width="2" height="3"/><rect x="6" y="36" width="2" height="3"/></g>
</svg>`;

// ---- rooms ----
const LAYOUT={
  shacho :{x:2,   y:9,  w:22, h:24, label:"社長室",     sub:"EXECUTIVE"},
  plan   :{x:25.5,y:9,  w:22, h:24, label:"企画室",     sub:"PLANNING"},
  caption:{x:49,  y:9,  w:22, h:24, label:"制作室",     sub:"CREATIVE"},
  trend  :{x:2,   y:36, w:21, h:27, label:"リサーチ室", sub:"RESEARCH"},
  account:{x:75,  y:36, w:23, h:27, label:"分析室",     sub:"ANALYTICS"},
  review :{x:2,   y:66, w:22, h:23, label:"レビュー室", sub:"REVIEW"},
};
const EXTRA=[
  {id:"meeting",  x:72.5,y:9,  w:25.5,h:24, label:"会議室",       sub:"MEETING"},
  {id:"break",   x:25.5,y:66, w:22, h:23, label:"休憩ラウンジ", sub:"LOUNGE"},
  {id:"lab",     x:49,  y:66, w:22, h:23, label:"制作ブース",   sub:"STUDIO"},
  {id:"entrance",x:72.5,y:66, w:25.5,h:23, label:"エントランス", sub:"ENTRANCE"},
];
const PICS=['linear-gradient(180deg,#bfe0c9,#8fc39a)','linear-gradient(180deg,#ffd9a0,#ff9e7a)','linear-gradient(135deg,#cfe6f0,#9ac1e0)','linear-gradient(180deg,#e9e2f5,#c9bde8)'];
function furniFor(id){
  const pc='<span class="f-pc"></span>';
  const desk=(x,y,w)=>`<div class="fz f-desk" style="left:${x}%;top:${y}%;width:${w}%;height:13%">${pc}</div>`;
  const plant=(x,y)=>`<div class="fz f-plant" style="left:${x}%;top:${y}%;width:30px;height:34px"><div class="leaf"></div><div class="pot"></div></div>`;
  const shelf=(x,y)=>`<div class="fz f-shelf" style="left:${x}%;top:${y}%;width:16%;height:30%"></div>`;
  const frame=(x,p)=>`<div class="fz f-frame" style="left:${x}%;top:13%;width:12%;height:15%;--pic:${PICS[p%4]}"></div>`;
  const win=(x,w)=>`<div class="fz f-window" style="left:${x}%;top:10%;width:${w||20}%;height:22%">${SKYLINE}</div>`;
  const board=(x,y,w,h)=>`<div class="fz f-board" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%"></div>`;
  const clock=(x,y,s)=>`<div class="fz f-clock" style="left:${x}%;top:${y}%;width:${s}px;height:${s}px"><b></b><i></i></div>`;
  const rug=(x,y,w,h)=>`<div class="fz f-rug" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%"></div>`;
  const sofa=(x,y,w)=>`<div class="fz f-sofa" style="left:${x}%;top:${y}%;width:${w}%;height:14%"></div>`;
  const table=(x,y,w,h)=>`<div class="fz f-table" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%"></div>`;
  const coffee=(x,y)=>`<div class="fz f-coffee" style="left:${x}%;top:${y}%"></div>`;
  const chair=(x,y)=>`<div class="fz f-chair" style="left:${x}%;top:${y}%"></div>`;
  switch(id){
    case 'shacho':  return win(56,22)+shelf(4,14)+shelf(82,14)+desk(33,31,34)+clock(90,12,18)+frame(20,2)+plant(88,66)+rug(20,60,55,32);
    case 'plan':    return board(8,12,30,20)+win(66,22)+desk(20,32,30)+frame(44,0)+plant(88,64);
    case 'caption': return board(6,12,28,20)+desk(20,32,30)+clock(88,12,18)+frame(40,1)+plant(86,64);
    case 'trend':   return win(6,22)+desk(50,31,30)+shelf(80,50)+frame(50,2)+plant(86,10);
    case 'account': return win(70,24)+desk(10,31,30)+shelf(4,50)+clock(90,12,18)+frame(44,3)+plant(8,64);
    case 'review':  return desk(12,31,28)+desk(56,31,28)+shelf(82,50)+frame(46,0)+frame(62,1)+plant(86,10);
    case 'meeting': return board(8,12,30,20)+table(30,46,44,28)+chair(26,44)+chair(70,44)+chair(26,66)+chair(70,66)+clock(90,12,18)+plant(86,64);
    case 'break':   return coffee(12,15)+sofa(28,60,40)+rug(24,55,52,34)+clock(84,12,18)+frame(44,1)+frame(60,2)+plant(86,62);
    case 'entrance':return win(18,22)+sofa(56,58,32)+desk(20,32,20)+frame(46,3)+plant(8,60)+plant(90,60);
    case 'lab':     return board(46,12,30,20)+desk(10,31,28)+desk(62,31,28)+plant(86,64);
    default:        return frame(48,0)+desk(14,31,28)+desk(58,31,28)+shelf(82,52)+plant(86,10);
  }
}

const unitById={}; OFFICE.units.forEach(u=>unitById[u.id]=u);
const rooms={};
function makeRoom(id,rect,color,label,sub){
  const el=document.createElement('div');el.className='room2';el.dataset.id=id;
  el.style.left=rect.x+'%';el.style.top=rect.y+'%';el.style.width=rect.w+'%';el.style.height=rect.h+'%';
  el.style.setProperty('--rc',color||'#c8934a');
  el.innerHTML=`<div class="wall"></div><div class="floorw"></div><div class="sunbeam"></div>${furniFor(id)}
    <div class="namehdr">${label}</div><div class="sub">${sub}</div><div class="badge2">稼働中</div>`;
  stage.insertBefore(el,anchor); rooms[id]={rect,el};
}
OFFICE.units.forEach(u=>{const L=LAYOUT[u.id];if(L)makeRoom(u.id,L,u.color,L.label,L.sub);});
(function(){const rect={x:25.5,y:36,w:47,h:27};const el=document.createElement('div');el.className='room2';el.dataset.id='hub';
  el.style.left=rect.x+'%';el.style.top=rect.y+'%';el.style.width=rect.w+'%';el.style.height=rect.h+'%';el.style.setProperty('--rc','#5aa06a');
  el.innerHTML=`<div class="wall"></div><div class="floorw"></div><div class="sunbeam"></div>
    <div class="fz f-window" style="left:8%;top:11%;width:22%;height:20%">${SKYLINE}</div>
    <div class="fz f-board" style="left:36%;top:12%;width:28%;height:18%"></div>
    <div class="fz f-clock" style="left:90%;top:12%;width:18px;height:18px"><b></b><i></i></div>
    <div class="fz f-rug" style="left:16%;top:40%;width:68%;height:50%"></div>
    <div class="fz f-table" style="left:30%;top:48%;width:40%;height:32%"></div>
    <div class="fz f-chair" style="left:24%;top:46%"></div><div class="fz f-chair" style="left:72%;top:46%"></div>
    <div class="fz f-chair" style="left:24%;top:72%"></div><div class="fz f-chair" style="left:72%;top:72%"></div>
    <div class="fz f-plant" style="left:88%;top:60%;width:30px;height:34px"><div class="leaf"></div><div class="pot"></div></div>
    <div class="namehdr">みんなの作業スペース</div><div class="sub">COMMONS</div><div class="badge2">稼働中</div>`;
  stage.insertBefore(el,anchor);rooms.hub={rect,el};})();
EXTRA.forEach(r=>makeRoom(r.id,{x:r.x,y:r.y,w:r.w,h:r.h},'#c8934a',r.label,r.sub));

// ---- agents ----
const rand=(a,b)=>a+Math.random()*(b-a);
const pointIn=r=>({x:rand(r.x+4,r.x+r.w-4),y:rand(r.y+r.h*0.64,r.y+r.h-3)});
const center=r=>({x:r.x+r.w/2,y:r.y+r.h*0.68});

const agents=[];let gi=0,mi=0,fi=0;
OFFICE.units.forEach(u=>{const rect=rooms[u.id].rect;
  u.members.forEach(m=>{
    const el=document.createElement('div');el.className='agent';
    const g=GENDERS[gi%GENDERS.length];
    const nm=(g==="M")?MALE_NAMES[mi++%MALE_NAMES.length]:FEMALE_NAMES[fi++%FEMALE_NAMES.length];
    const charSrc=(OFFICE.charSrcs&&OFFICE.charSrcs[gi%OFFICE.charSrcs.length])||("assets/chars/"+CHARS[gi%CHARS.length]);
    const tokInner=(OFFICE.assets==="svg")?personSVG(gi,u.color,g):`<img src="${charSrc}" alt="" loading="lazy" draggable="false">`;
    el.innerHTML=`<div class="bub"></div><div class="np"><b>${nm}</b><span>${m.name}</span><i></i></div><div class="tok">${tokInner}</div>`;
    const p=pointIn(rect);el.style.left=p.x+'%';el.style.top=p.y+'%';
    stage.insertBefore(el,anchor);
    agents.push({el,uid:u.id,role:m.name,home:rect,x:p.x,y:p.y,bub:el.querySelector('.bub'),wt:null});
    gi++;
  });
});
function moveAgent(a,x,y){a.x=x;a.y=y;a.el.style.left=x+'%';a.el.style.top=y+'%';
  a.el.classList.add('walking');clearTimeout(a.wt);a.wt=setTimeout(()=>a.el.classList.remove('walking'),2700);}

let gathering=false;
function wander(a){if(!gathering){const p=pointIn(a.home);moveAgent(a,p.x,p.y);}setTimeout(()=>wander(a),rand(3400,7600));}
agents.forEach(a=>setTimeout(()=>wander(a),rand(500,3400)));

const worklines={};OFFICE.units.forEach(u=>worklines[u.id]=(u.worklines&&u.worklines.length)?u.worklines:['作業中…']);
const CHAT=["新しいバズ音源、来てるらしい","この企画、伸びる予感…！","コーヒー淹れてくる、いる人ー？","LIVEの新規流入、じわ伸び中","この観葉植物、また増えた？","データ同期、完了しました","ランチどこ行く？","今日もいい配信になりそう","会議室いま空いてるよ","締切まであと少し！"];
let chatOn=true;
function speak(a,t){a.bub.textContent=t;a.bub.classList.add('show');a.el.classList.add('busy');
  setTimeout(()=>{a.bub.classList.remove('show');a.el.classList.remove('busy');},3400+Math.random()*1200);}
function bubbleLoop(){
  if(chatOn&&document.querySelectorAll('.bub.show').length<4){
    const a=agents[Math.floor(Math.random()*agents.length)];
    const lines=Math.random()<0.55?worklines[a.uid]:CHAT;
    speak(a,lines[Math.floor(Math.random()*lines.length)]);
  }
  setTimeout(bubbleLoop,1500+Math.random()*1500);
}
bubbleLoop();

function tick(){const n=new Date(),p=x=>String(x).padStart(2,'0');document.getElementById('clock').textContent=`${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;}
setInterval(tick,1000);tick();
if(OFFICE.latest)document.getElementById('mInfo').textContent='現在の案件: '+OFFICE.latest.title;

const menu=document.getElementById('menu');
document.getElementById('gear').addEventListener('click',()=>menu.classList.toggle('open'));
document.getElementById('mChat').addEventListener('click',()=>{chatOn=!chatOn;});
document.getElementById('mRun').addEventListener('click',()=>{menu.classList.remove('open');runSim();});

const sim=OFFICE.sim,runBtn=document.getElementById('runBtn'),capMsg=document.getElementById('capMsg'),tickerline=document.getElementById('tickerline');
let running=false,orb=null;
function ensureOrb(){if(!orb){orb=document.createElement('div');orb.className='orb';stage.insertBefore(orb,anchor);}return orb;}
function orbTo(rect,icon){const o=ensureOrb();const c=center(rect);o.textContent=icon||'📄';o.style.opacity='1';o.style.left=c.x+'%';o.style.top=c.y+'%';}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function runSim(){
  if(running)return;running=true;runBtn.disabled=true;runBtn.textContent='稼働中…';
  Object.values(rooms).forEach(r=>r.el.classList.remove('active'));
  const o=ensureOrb();const s0=center(rooms.shacho.rect);o.style.left=s0.x+'%';o.style.top=s0.y+'%';
  for(let i=0;i<sim.length;i++){
    const step=sim[i];const room=rooms[step.id]||rooms.hub;
    orbTo(room.rect,step.icon);
    Object.values(rooms).forEach(r=>r.el.classList.remove('active'));
    room.el.classList.add('active');
    capMsg.innerHTML='<b>'+step.status+'</b>';
    const turns=(OFFICE.discussions&&OFFICE.discussions[step.id])||[];
    const roomAgents=agents.filter(a=>a.uid===step.id);
    if(turns.length && i<sim.length-1){
      const play=turns.slice(0,3);
      for(let k=0;k<play.length;k++){
        const tn=play[k];
        const ag=roomAgents.find(a=>a.role===tn.s)||roomAgents[k%(roomAgents.length||1)]||roomAgents[0];
        if(ag){ag.el.classList.add('busy');ag.bub.textContent=tn.t;ag.bub.classList.add('show');}
        tickerline.textContent=step.tag+' ・ '+tn.s+'「'+tn.t+'」';
        await wait(1550);
        if(ag){ag.bub.classList.remove('show');ag.el.classList.remove('busy');}
      }
    } else {
      roomAgents.forEach(a=>{a.el.classList.add('busy');speak(a,step.msg);});
      tickerline.textContent=step.tag+' ・ '+step.msg;
      await wait(1650);
    }
  }
  gathering=true;
  const hubC=center(rooms.hub.rect);const leads=[];
  OFFICE.units.forEach(u=>{const lead=agents.find(a=>a.uid===u.id);if(lead)leads.push({a:lead,home:{x:lead.x,y:lead.y}});});
  leads.forEach((L,k)=>{const ang=(k/leads.length)*Math.PI*2;moveAgent(L.a,hubC.x+Math.cos(ang)*13,hubC.y+Math.sin(ang)*7);L.a.el.classList.add('busy');});
  if(orb){orb.style.left=hubC.x+'%';orb.style.top=hubC.y+'%';orb.textContent='✅';}
  tickerline.textContent='✅ みんなの作業スペースで総括 ・ 最終GO';
  await wait(2600);
  leads.forEach(L=>{moveAgent(L.a,L.home.x,L.home.y);L.a.el.classList.remove('busy');});
  gathering=false;if(orb)orb.style.opacity='0';
  Object.values(rooms).forEach(r=>r.el.classList.remove('active'));
  capMsg.innerHTML=OFFICE.latest?`案件「<b>${OFFICE.latest.title}</b>」の成果がダッシュボードに蓄積されました。`:'稼働完了。成果が蓄積されました。';
  tickerline.textContent='';runBtn.disabled=false;runBtn.textContent='▶ もう一度稼働';running=false;
}
runBtn.addEventListener('click',runSim);
</script>
</body>
